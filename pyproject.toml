[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rubric-forecasting"
version = "2.2.0"
description = "Deterministic rubric engine for structured forecasting (JSON in/out)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Rubric Forecasting contributors" }]
keywords = ["forecasting", "rubric", "scoring", "prediction"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
rubric-forecast = "rubric_forecast.engine:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rubric_forecast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
