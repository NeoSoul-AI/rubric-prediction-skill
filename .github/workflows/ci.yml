name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev deps
        run: pip install -e ".[dev]"

      - name: Pytest
        run: pytest

      - name: CLI smoke (installed entry point)
        run: |
          rubric-forecast --input examples/polymarket_hormuz_geopolitics_input.json --output /tmp/out.json
          python -c "import json; d=json.load(open('/tmp/out.json')); assert d['status']=='ok'"

      - name: Module smoke
        run: |
          python -m rubric_forecast --input examples/polymarket_hormuz_geopolitics_input.json --output /tmp/out2.json
          python -c "import json; d=json.load(open('/tmp/out2.json')); assert d['status']=='ok'"
